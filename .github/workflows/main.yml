name: CI

on: [push]

jobs:
  test:
    name: ARK Resolver Data Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ARK resolver data unit tests
        run: |
          make install
          make test
